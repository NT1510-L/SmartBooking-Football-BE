services:
  - type: keyvalue
    name: football-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    runtime: docker
    name: football-api
    region: singapore
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__Booking
        sync: false
      - key: ConnectionStrings__Pricing
        sync: false
      - key: Pricing__RunLocal
        value: "true"
      - key: RunBookingWorker
        value: "true"
      - key: ConnectionStrings__Redis
        fromService: { type: keyvalue, name: football-redis, property: connectionString }
      - key: Jwt__Key
        generateValue: true
      - key: BootstrapAdmin__Email
        value: admin@example.test
      - key: BootstrapAdmin__Password
        sync: false
      - key: Web__Origin
        sync: false
      - key: Sepay__Bank
        value: Sacombank
      - key: Sepay__AccountNumber
        sync: false
      - key: Sepay__WebhookKey
        sync: false
