services:
  - type: keyvalue
    name: football-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # gRPC is internal-only. The public API is the only service exposed externally.
  - type: pserv
    runtime: docker
    name: football-pricing
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.pricing
    dockerContext: .
    envVars:
      - key: ConnectionStrings__Pricing
        sync: false

  - type: web
    runtime: docker
    name: football-api
    region: singapore
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: ConnectionStrings__Booking
        sync: false
      - key: Pricing__HostPort
        fromService: { type: pserv, name: football-pricing, property: hostport }
      - key: Jwt__Key
        generateValue: true
      - key: BootstrapAdmin__Email
        value: admin@example.test
      - key: BootstrapAdmin__Password
        sync: false
      - key: Web__Origin
        sync: false
      - key: Sepay__Bank
        value: Sacombank
      - key: Sepay__AccountNumber
        sync: false
      - key: Sepay__WebhookKey
        sync: false

  - type: worker
    runtime: docker
    name: football-worker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: RunMode
        value: Worker
      - key: ConnectionStrings__Booking
        sync: false
      - key: ConnectionStrings__Redis
        fromService: { type: keyvalue, name: football-redis, property: connectionString }
