syntax = "proto3";
option csharp_namespace = "SmartBooking.Pricing";
package pricing;

service PricingService {
  rpc Quote (QuoteRequest) returns (PriceQuote);
  rpc List (BranchRequest) returns (PolicyList);
  rpc Save (Policy) returns (Policy);
  rpc Remove (PolicyKey) returns (PolicyKey);
}
message QuoteRequest { int64 branch_id = 1; string local_date = 2; int32 hour = 3; }
message PriceQuote { int64 policy_id = 1; int64 amount = 2; }
message BranchRequest { int64 branch_id = 1; }
message PolicyKey { int64 branch_id = 1; int64 id = 2; }
message PolicyList { repeated Policy policies = 1; }
message Policy {
  int64 id = 1;
  int64 branch_id = 2;
  string effective_from = 3;
  int64 regular_price_vnd = 4;
  int64 peak_price_vnd = 5;
  int32 peak_start_hour = 6;
  int32 peak_end_hour = 7;
}
